<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice call</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 28rem;
    margin: 0 auto;
    padding: 1rem;
    color: #1a1a1a;
    background: #fff;
  }
  h1 { font-size: 1.1rem; margin: 0 0 1rem; }
  .row { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
  button {
    font-size: 1rem;
    padding: 0.6rem 1.2rem;
    border: 1px solid #555;
    border-radius: 0.4rem;
    background: #fff;
  }
  button:disabled { opacity: 0.4; }
  button.on { background: #1a1a1a; color: #fff; }
  #talk.down { background: #b00020; border-color: #b00020; color: #fff; }
  #secret { flex: 1; font-size: 1rem; padding: 0.6rem; border: 1px solid #555; border-radius: 0.4rem; }
  #line { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
  #status { font-weight: 600; }
  #meter { height: 0.6rem; border: 1px solid #555; border-radius: 0.3rem; margin-bottom: 0.75rem; }
  #meter-fill { height: 100%; width: 0%; background: #1a1a1a; }
  #log { font-size: 0.85rem; }
  #log div { padding: 0.15rem 0; border-bottom: 1px solid #eee; }
  .hint { font-size: 0.85rem; color: #333; }
</style>
</head>
<body>
<h1>Voice call</h1>
<div class="row">
  <input id="secret" type="password" autocomplete="off" placeholder="Paste the server secret once" aria-label="Server secret">
  <button id="save" type="button">Save</button>
</div>
<div class="row">
  <button id="start" type="button">Start</button>
  <button id="stop" type="button" disabled>Stop</button>
  <button id="mode-vad" type="button" class="on">VAD</button>
  <button id="mode-ptt" type="button">PTT</button>
</div>
<div class="row">
  <button id="talk" type="button" hidden>Hold to talk</button>
</div>
<div id="line"><span id="status">idle</span><span id="rtt">-- ms</span></div>
<div id="meter" aria-hidden="true"><div id="meter-fill"></div></div>
<p class="hint">Wear headphones: the page hears its own reply through speakers.</p>
<div id="log" aria-live="off"></div>
<script type="module" src="app.js"></script>
</body>
</html>
